# Собирает AION2Helper.exe и папку AION2Helper.zip и прикладывает их к выпуску GitHub.
# Срабатывает при публикации выпуска, при пуше в main (если выпуск текущей версии уже есть) и вручную.
name: Build exe for release

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Version info (icon, manifest, version)
        run: |
          VER=$(grep -oP 'appVersion = "\K[^"]+' main.go)
          IFS=. read MA MI PA <<< "$VER"
          jq --arg v "$VER" --argjson a "$MA" --argjson b "$MI" --argjson c "${PA:-0}" \
            '.StringFileInfo.FileVersion=$v | .StringFileInfo.ProductVersion=$v
             | .FixedFileInfo.FileVersion={Major:$a,Minor:$b,Patch:$c,Build:0}
             | .FixedFileInfo.ProductVersion={Major:$a,Minor:$b,Patch:$c,Build:0}' versioninfo.json > vi.json
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1
          rm -f rsrc_windows_amd64.syso
          ~/go/bin/goversioninfo -64 -o resource_windows_amd64.syso vi.json
      - name: Check embedded files
        run: |
          for f in web/index.html web/data/calcdata.js web/data/mapdata.js web/data/extra.js web/data/content.js web/i18n_en.js; do
            test -s "$f" || { echo "нет файла $f"; exit 1; }
          done
      - name: Build
        run: |
          GOFLAGS=-mod=mod GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui" -o AION2Helper.exe .
          ls -la AION2Helper.exe
      - name: Portable folder
        run: |
          D="AION2 Helper"
          mkdir -p "$D/data" "$D/exports"
          cp AION2Helper.exe dist/README.txt "dist/Прочитай меня.txt" "$D/"
          zip -r -X AION2Helper.zip "$D"
          unzip -l AION2Helper.zip
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v$(grep -oP 'appVersion = "\K[^"]+' main.go)"
          fi
          echo "tag: $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "push" ] && [ -s dist/notes.md ]; then
              echo "Создаю выпуск $TAG"
              gh release create "$TAG" --title "AION 2 Helper ${TAG#v}" --notes-file dist/notes.md --target "${{ github.sha }}"
            else
              echo "Выпуска $TAG нет — пропускаю"; exit 0
            fi
          fi
          gh release upload "$TAG" AION2Helper.zip AION2Helper.exe --clobber
